<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penilaian Piket Kelas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-40">
      <div
        class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2"
      >
        <div>
          <span
            class="text-xs bg-blue-500/50 px-2.5 py-1 rounded-full font-medium"
            id="badge-kelas"
            >Kelas: -</span
          >
          <h2 id="welcomeText" class="text-base font-bold mt-1">
            Selamat datang Petugas
          </h2>
        </div>
        <button
          onclick="logout()"
          class="text-xs bg-red-500/80 hover:bg-red-600 px-3.5 py-2 rounded-lg font-semibold transition-all"
        >
          Logout
        </button>
      </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
      <!-- Modal Tahap 2: Authentication Piket NISN -->
      <div
        id="piketAuthModal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
      >
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl">
          <h3 class="text-lg font-bold text-slate-800 mb-2">
            Autentikasi Petugas Piket
          </h3>
          <p class="text-xs text-slate-500 mb-6">
            Masukkan NISN & Password Pribadi Petugas untuk memulai sesi
            penilaian.
          </p>
          <form onsubmit="verifyPiket(event)" class="space-y-4">
            <div>
              <label
                class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >NISN Petugas</label
              >
              <input
                type="text"
                id="piket-nisn"
                required
                class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Password</label
              >
              <input
                type="password"
                id="piket-pass"
                required
                class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <button
              type="submit"
              class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl text-sm shadow-md"
            >
              Verifikasi Petugas
            </button>
          </form>
        </div>
      </div>

      <!-- Panel Form Penilaian Siswa -->
      <div
        class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-6"
      >
        <h3 class="text-lg font-bold text-slate-800 border-b pb-3">
          Penilaian Kedisiplinan Siswa
        </h3>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2"
            >Pilih Nama Siswa</label
          >
          <select
            id="siswa-select"
            onchange="onSiswaSelected()"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">-- Pilih Siswa --</option>
          </select>
        </div>

        <!-- Action Buttons -->
        <div id="actionArea" class="hidden grid grid-cols-2 gap-4">
          <button
            onclick="submitPenilaian('Aman')"
            class="py-4 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 font-bold rounded-2xl flex flex-col items-center gap-1 transition-all"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
            Sesuai / Aman
          </button>
          <button
            onclick="openModalPelanggaran()"
            class="py-4 bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 font-bold rounded-2xl flex flex-col items-center gap-1 transition-all"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
            Pelanggaran
          </button>
        </div>
      </div>
    </main>

    <!-- Popup Modal Opsi Pelanggaran Detail -->
    <div
      id="modalPelanggaran"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
    >
      <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl">
        <h3 class="text-lg font-bold text-slate-800 mb-2">
          Detail Pelanggaran
        </h3>
        <p class="text-xs text-slate-500 mb-4">
          Pilih satu atau lebih kategori pelanggaran yang dilakukan siswa:
        </p>

        <div
          id="kategoriContainer"
          class="grid grid-cols-2 gap-2 mb-6 max-h-48 overflow-y-auto p-1"
        >
          <!-- Checklist Kategori Pelanggaran -->
        </div>

        <div class="flex justify-end gap-3">
          <button
            onclick="closeModalPelanggaran()"
            class="px-4 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold"
          >
            Batal
          </button>
          <button
            onclick="submitPenilaian('Pelanggaran')"
            class="px-5 py-2.5 bg-red-600 text-white rounded-xl text-sm font-semibold shadow-lg shadow-red-500/30"
          >
            Kirim Penilaian
          </button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/app.js"></script>
    <script>
      let session = null;
      let piketInfo = null;
      let masterKategori = [];
      let masterSiswa = [];
      let todayLogs = []; // Caching log penilaian hari ini

      document.addEventListener("DOMContentLoaded", () => {
        session = checkSession("kelas");
        if (!session) return;
        document.getElementById("badge-kelas").innerText =
          `Kelas: ${session.kelas}`;
      });

      function verifyPiket(e) {
        e.preventDefault();
        showLoading(true);
        const payload = {
          action: "loginPiket",
          nisn: document.getElementById("piket-nisn").value,
          password: document.getElementById("piket-pass").value,
        };

        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
          .then((res) => res.json())
          .then((res) => {
            showLoading(false);
            if (res.success) {
              piketInfo = res;
              document.getElementById("piketAuthModal").classList.add("hidden");

              const kw = getKategoriWaktu();
              document.getElementById("welcomeText").innerText =
                `Selamat ${kw} ${res.nama}`;

              loadInitialData();
            } else {
              showModal("Login Piket Gagal", res.message, true);
            }
          })
          .catch((err) => {
            showLoading(false);
            showModal("Error", "Gagal terhubung ke server", true);
          });
      }

      // FUNGSI BARU: Khusus untuk merender dropdown siswa dengan menyaring yang sudah dinilai pada sesi aktif
      function renderSiswaDropdown() {
        const select = document.getElementById("siswa-select");
        select.innerHTML = '<option value="">-- Pilih Siswa --</option>';

        const currentKW = getKategoriWaktu();

        // Dapatkan daftar NISN yang sudah dinilai pada Kategori Waktu saat ini
        const assessedNisns = todayLogs
          .filter((l) => l.Kategori_Waktu === currentKW)
          .map((l) => String(l.NISN_Siswa));

        const fragment = document.createDocumentFragment();
        let availableCount = 0;

        masterSiswa.forEach((s) => {
          // Hanya tampilkan siswa yang BELUM dinilai pada sesi waktu berjalan
          if (!assessedNisns.includes(String(s.NISN))) {
            const opt = document.createElement("option");
            opt.value = s.NISN;
            opt.textContent = `${s.Nama_Siswa} (${s.NISN})`;
            fragment.appendChild(opt);
            availableCount++;
          }
        });

        select.appendChild(fragment);

        // Jika seluruh siswa dalam kelas sudah dinilai pada sesi ini
        if (availableCount === 0 && masterSiswa.length > 0) {
          const optDone = document.createElement("option");
          optDone.value = "";
          optDone.textContent = "🎉 Semua siswa sudah dinilai pada sesi ini";
          optDone.disabled = true;
          select.appendChild(optDone);
        }
      }

      function loadInitialData() {
        showLoading(true);
        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "getInitialData",
            kelas: session.kelas,
          }),
        })
          .then((res) => res.json())
          .then((res) => {
            showLoading(false);
            if (res.success) {
              masterSiswa = res.siswa;
              masterKategori = res.kategori;
              todayLogs = res.todayLogs || [];

              // Panggil fungsi render dropdown yang disaring
              renderSiswaDropdown();

              // Render Kategori Pelanggaran
              const katContainer = document.getElementById("kategoriContainer");
              katContainer.innerHTML = "";
              res.kategori.forEach((k) => {
                katContainer.innerHTML += `
    <label class="flex items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer text-sm">
      <input type="checkbox" name="kat_pelanggaran" value="${k.Nama_Kategori}" class="w-4 h-4 text-red-600 rounded">
      <span class="text-slate-700 font-medium">${k.Nama_Kategori}</span>
    </label>`;
              });
            }
          })
          .catch((err) => {
            showLoading(false);
            showModal("Error", "Gagal memuat data awal", true);
          });
      }

      function onSiswaSelected() {
        const nisn = document.getElementById("siswa-select").value;
        if (!nisn) {
          document.getElementById("actionArea").classList.add("hidden");
          return;
        }

        const currentKatWaktu = getKategoriWaktu();

        const found = todayLogs.find(
          (l) =>
            String(l.NISN_Siswa) === String(nisn) &&
            l.Kategori_Waktu === currentKatWaktu,
        );

        if (found) {
          document.getElementById("actionArea").classList.add("hidden");
          const statusStr = found.Status_HSJA || found.Status_Piket;
          const detailStr =
            found.Pelanggaran_HSJA || found.Pelanggaran_Piket || "Aman";
          showModal(
            "Pemberitahuan",
            `Siswa ini sudah dinilai untuk sesi ${currentKatWaktu} ini dengan status: [${statusStr} - ${detailStr}]`,
            false,
          );
        } else {
          document.getElementById("actionArea").classList.remove("hidden");
        }
      }

      function openModalPelanggaran() {
        document.getElementById("modalPelanggaran").classList.remove("hidden");
      }

      function closeModalPelanggaran() {
        document.getElementById("modalPelanggaran").classList.add("hidden");
      }

      function submitPenilaian(status) {
        const select = document.getElementById("siswa-select");
        const nisn = select.value;
        const siswaObj = masterSiswa.find(
          (s) => String(s.NISN) === String(nisn),
        );

        let selectedPelanggaran = [];
        if (status === "Pelanggaran") {
          const checkboxes = document.querySelectorAll(
            'input[name="kat_pelanggaran"]:checked',
          );
          checkboxes.forEach((c) => selectedPelanggaran.push(c.value));
          if (selectedPelanggaran.length === 0) {
            showModal(
              "Peringatan",
              "Pilih minimal 1 kategori pelanggaran!",
              true,
            );
            return;
          }
        }

        showLoading(true);
        const currentKW = getKategoriWaktu();
        const payload = {
          action: "submitPenilaianPiket",
          kelas: session.kelas,
          nisn_siswa: nisn,
          nama_siswa: siswaObj ? siswaObj.Nama_Siswa : "-",
          kategori_waktu: currentKW,
          status_piket: status,
          pelanggaran_piket: selectedPelanggaran.join(", "),
          petugas_piket: piketInfo.nama,
        };

        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
          .then((res) => res.json())
          .then((res) => {
            showLoading(false);
            closeModalPelanggaran();
            if (res.success) {
              // Update cache lokal
              todayLogs.push({
                NISN_Siswa: nisn,
                Kategori_Waktu: currentKW,
                Status_Piket: status,
                Pelanggaran_Piket: selectedPelanggaran.join(", ") || "Aman",
              });

              // Reset Uncheck Pelanggaran
              document
                .querySelectorAll('input[name="kat_pelanggaran"]')
                .forEach((cb) => (cb.checked = false));

              showModal("Berhasil", res.message, false, () => {
                // Render ulang dropdown agar siswa yang baru saja dinilai langsung disembunyikan
                renderSiswaDropdown();
                select.value = "";
                document.getElementById("actionArea").classList.add("hidden");
              });
            } else {
              showModal("Gagal", res.message, true);
            }
          })
          .catch((err) => {
            showLoading(false);
            showModal("Error", "Gagal mengirim penilaian", true);
          });
      }

      function logout() {
        localStorage.removeItem("app_session");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
